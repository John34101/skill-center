<html style="margin:0;padding:0;"><div style="background-color:#F7F8FA;box-sizing:border-box;font-family:'Roboto','PingFang SC','Segoe UI',Arial,sans-serif;padding:20px;color:#1A1B1C;">
  <div style="max-width:920px;margin:0 auto;background:#fff;border-radius:14px;padding:24px 28px;box-shadow:0 2px 10px rgba(0,0,0,.06);box-sizing:border-box;">
    <div style="font-size:11px;color:#6B7280;letter-spacing:1px;">初三代数 · 知识地图（形式化）</div>
    <h3 style="font-size:20px;margin:6px 0 4px;">一元二次方程：一张图看清全章关系</h3>
    <div style="font-size:13px;color:#6B7280;line-height:1.6;">概念 → 判别 → 四解法 → 根的判别 → 根与系数 → 应用，六块之间的真实关系如下。</div>

    <svg viewBox="0 0 880 470" width="100%" style="display:block;max-width:880px;margin:18px auto 6px;">
      <!-- 定义 -->
      <rect x="320" y="10" width="240" height="52" rx="10" fill="#9BBBF4" opacity=".92"/>
      <text x="440" y="32" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">定义</text>
      <text x="440" y="50" font-size="11.5" fill="#fff" text-anchor="middle">ax²+bx+c=0（a≠0）</text>
      <!-- 判别 -->
      <rect x="330" y="96" width="220" height="52" rx="10" fill="#C9A7E8" opacity=".85"/>
      <text x="440" y="118" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">判别：是不是一元二次</text>
      <text x="440" y="136" font-size="11.5" fill="#fff" text-anchor="middle">a≠0 · 未知数最高次=2</text>
      <line x1="440" y1="62" x2="440" y2="96" stroke="#9AA5B1" stroke-width="1.6" marker-end="url(#ar)"/>
      <!-- 解法 -->
      <rect x="20" y="190" width="196" height="70" rx="10" fill="#F4B393" opacity=".9"/>
      <text x="118" y="216" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">解法① 直接开平</text>
      <text x="118" y="236" font-size="11.5" fill="#fff" text-anchor="middle">(x+m)²=n → x=…</text>
      <rect x="252" y="190" width="196" height="70" rx="10" fill="#F4B393" opacity=".9"/>
      <text x="350" y="216" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">解法② 配方法</text>
      <text x="350" y="236" font-size="11.5" fill="#fff" text-anchor="middle">配方→开平，求根公式之母</text>
      <rect x="484" y="190" width="196" height="70" rx="10" fill="#F4B393" opacity=".9"/>
      <text x="582" y="216" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">解法③ 公式法</text>
      <text x="582" y="236" font-size="11.5" fill="#fff" text-anchor="middle">x=[−b±√Δ]/2a</text>
      <rect x="716" y="190" width="146" height="70" rx="10" fill="#F4B393" opacity=".9"/>
      <text x="789" y="216" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">解法④ 因式分解</text>
      <text x="789" y="236" font-size="11.5" fill="#fff" text-anchor="middle">十字相乘/提取</text>
      <line x1="430" y1="148" x2="118" y2="190" stroke="#9AA5B1" stroke-width="1.6"/>
      <line x1="440" y1="148" x2="350" y2="190" stroke="#9AA5B1" stroke-width="1.6"/>
      <line x1="450" y1="148" x2="582" y2="190" stroke="#9AA5B1" stroke-width="1.6"/>
      <line x1="455" y1="148" x2="789" y2="190" stroke="#9AA5B1" stroke-width="1.6"/>
      <text x="100" y="182" font-size="11" fill="#8a7a5a">并列，按题目结构选</text>
      <!-- Δ -->
      <rect x="60" y="320" width="240" height="66" rx="10" fill="#5E8D66" opacity=".92"/>
      <text x="180" y="344" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">根的判别式 Δ=b²−4ac</text>
      <text x="180" y="366" font-size="11.5" fill="#fff" text-anchor="middle">Δ&gt;0 两不等实根 · Δ=0 两相等 · Δ&lt;0 无实根</text>
      <line x1="350" y1="260" x2="180" y2="320" stroke="#9AA5B1" stroke-width="1.6"/>
      <text x="230" y="295" font-size="11" fill="#5E8D66">由公式法得出</text>
      <!-- 韦达 -->
      <rect x="580" y="320" width="240" height="66" rx="10" fill="#B4863D" opacity=".9"/>
      <text x="700" y="344" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">根与系数：韦达定理</text>
      <text x="700" y="366" font-size="11.5" fill="#fff" text-anchor="middle">x₁+x₂=−b/a · x₁·x₂=c/a</text>
      <line x1="582" y1="260" x2="700" y2="320" stroke="#9AA5B1" stroke-width="1.6"/>
      <text x="655" y="295" font-size="11" fill="#B4863D">由求根公式导出</text>
      <!-- 应用 -->
      <rect x="300" y="416" width="280" height="44" rx="10" fill="#94D8C3" opacity=".9"/>
      <text x="440" y="444" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle">应用：增长率 · 面积 · 利润建模</text>
      <line x1="440" y1="386" x2="440" y2="416" stroke="#9AA5B1" stroke-width="1.6"/>
      <text x="452" y="406" font-size="11" fill="#4a7d6f">列方程→选解法→验根</text>
      <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9AA5B1"/></marker></defs>
    </svg>

    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;">
      <div style="flex:1 1 200px;min-width:0;padding:12px;background:#F4F6FB;border-radius:10px;box-sizing:border-box;">
        <div style="font-size:12px;color:#4a5568;font-weight:600;">考点提醒</div>
        <div style="font-size:12.5px;color:#1A1B1C;margin-top:4px;line-height:1.55;">Δ 不只看根，还决定"图像与 x 轴交点个数"——数形结合常考</div>
      </div>
      <div style="flex:1 1 200px;min-width:0;padding:12px;background:#F4F6FB;border-radius:10px;box-sizing:border-box;">
        <div style="font-size:12px;color:#4a5568;font-weight:600;">常见坑</div>
        <div style="font-size:12.5px;color:#1A1B1C;margin-top:4px;line-height:1.55;">忘掉 a≠0；用韦达前先判 Δ≥0；应用题验根是否符合实际</div>
      </div>
      <div style="flex:1 1 200px;min-width:0;padding:12px;background:#F4F6FB;border-radius:10px;box-sizing:border-box;">
        <div style="font-size:12px;color:#4a5568;font-weight:600;">一句话记忆</div>
        <div style="font-size:12.5px;color:#1A1B1C;margin-top:4px;line-height:1.55;">定义定身份，判别定资格，四法选捷径，Δ 定根况，韦达连根系，应用建模型</div>
      </div>
    </div>
  </div>
</div></html>
