<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:675px;font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#1d2a3f 0%,#0e1522 55%,#0a0f18 100%);color:#E8ECF3;overflow:hidden}
.wrap{position:relative;width:100%;height:100%;padding:52px 64px;box-sizing:border-box}
.grid{position:absolute;inset:0;opacity:.35;background-image:linear-gradient(rgba(120,150,200,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,200,.14) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(1100px 620px at 50% 40%,#000 30%,transparent 100%);mask-image:radial-gradient(1100px 620px at 50% 40%,#000 30%,transparent 100%)}
.brand{position:relative;font-size:15px;letter-spacing:4px;color:#8FA8D8;font-weight:600;display:flex;align-items:center;gap:12px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:#6EE7A8;box-shadow:0 0 14px #6EE7A8}
.skill{position:relative;margin-top:14px;font-family:'SF Mono','JetBrains Mono',monospace;font-size:16px;color:#5FC8FF;letter-spacing:1px}
.name{position:relative;margin-top:10px;font-size:42px;font-weight:700;line-height:1.25;color:#F5F7FB}
.scene{position:relative;margin-top:26px;display:inline-flex;align-items:center;gap:10px;background:rgba(95,200,255,.10);border:1px solid rgba(95,200,255,.35);padding:8px 18px;border-radius:30px;font-size:16px;color:#9FD4F7}
.point{position:relative;margin-top:30px;font-size:19px;color:#C6D2E2;line-height:1.7;max-width:900px}
.foot{position:absolute;bottom:40px;left:64px;right:64px;display:flex;justify-content:space-between;font-size:13px;color:#5A6B82;letter-spacing:1px}
.tag{position:absolute;top:52px;right:64px;font-family:'SF Mono',monospace;font-size:14px;color:#6EE7A8;border:1px solid rgba(110,231,168,.45);padding:6px 14px;border-radius:20px;letter-spacing:2px}
</style></head><body><div class="wrap">
<div class="grid"></div>
<div class="tag">L3 · 案例档案</div>
<div class="brand"><span class="dot"></span>SKILL CENTER · 真实试跑</div>
<div class="skill">writing-beats</div>
<div class="name">口播稿·刷题没效果三件事·节奏骨架</div>
<div class="scene">口播视频 · 2026-10-08 · 已验证可复现</div>
<div class="point">钩子→反转→限时训练→讲题输出→间隔重做→收尾，6 拍起承转合</div>
<div class="foot"><span>豆包 × Skill 管理中心</span><span>L4 产出闭环 · 30 分钟试跑沉淀</span></div>
</div></body></html>
