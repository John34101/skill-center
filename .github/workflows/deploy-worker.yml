# ============================================================
# Skill 中心 · 后端 Worker 自动部署（Cloudflare + wrangler）
# 触发：推送 backend/ 相关文件时自动部署；也可手动触发。
# 所需 GitHub Secrets：
#   CLOUDFLARE_ACCOUNT_ID   = d00a6dabc469e8be820bd6904357421c
#   CLOUDFLARE_API_TOKEN    = 你在 Cloudflare 创建的 API Token
#   APP_ID / APP_SECRET     = 飞书自建应用凭证（注入为 Worker 机密变量）
# 说明：先 wrangler deploy（应用 wrangler.toml 的 KV 绑定），
#       再 echo | wrangler secret put 注入飞书凭证，顺序保证 KV 不丢。
# ============================================================
name: deploy-skill-center-worker

on:
  push:
    paths:
      - "backend/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Worker (wrangler deploy, KV 绑定来自 wrangler.toml)
        run: npx -y wrangler@4 deploy

      - name: Inject secret APP_ID
        run: echo "${{ secrets.APP_ID }}" | npx -y wrangler@4 secret put APP_ID --name skill-center-api

      - name: Inject secret APP_SECRET
        run: echo "${{ secrets.APP_SECRET }}" | npx -y wrangler@4 secret put APP_SECRET --name skill-center-api
