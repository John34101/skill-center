# ============================================================
# 每日 skill 推荐（M4 完整外置：抓取 → 打分 → 直写 D1）
# 作用：每天早上 9 点（UTC 1:00）自动抓取 GitHub Trending + 聚合站候选，
#       规则打分生成双档（为你推荐 5 + 全网热门 5），直接写入 Cloudflare D1。
# 网页前端读 /api/recs/today 自动可见，不再依赖豆包定时任务。
# 凭证：CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（仓库 secrets）
# ============================================================
name: daily-skill-recommend-fetch

on:
  schedule:
    - cron: "0 1 * * *"          # UTC 1:00 = 北京时间 9:00
  workflow_dispatch:             # 支持手动触发

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行每日双档推荐（fetch → select → 写 D1）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 recommend.py all-d1
