name: Release

# 触发：推送形如 v0.1.0 的 tag 时自动创建 GitHub Release
# 配合 AGENTS.md §13 版本流程：递增 VERSION → 提交 → 打 tag v<VERSION> → 推送 → 本 workflow 兜底建 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release 需要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验 VERSION 与 tag 一致
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag_version=$TAG" >> "$GITHUB_OUTPUT"
          if [ -f VERSION ]; then
            FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
            echo "file_version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
            if [ "$TAG" != "$FILE_VERSION" ]; then
              echo "::warning::VERSION 文件为 $FILE_VERSION，与 tag $TAG 不一致，请检查"
            else
              echo "VERSION 与 tag 一致：$TAG"
            fi
          else
            echo "::warning::根目录未找到 VERSION 文件，无法校验版本号"
          fi

      - name: 从 CHANGELOG 提取本版本发布说明
        run: |
          python3 - <<'PY'
          import re
          ver = "${{ steps.meta.outputs.tag_version }}"
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              text = ""
          # 匹配 "## [x.y.z] ..." 段落，直到下一个 "## " 或文件结尾
          m = re.search(r"##\s*\[" + re.escape(ver) + r"\][^\n]*\n(.*?)(?=\n##\s|$)", text, re.DOTALL)
          notes = m.group(1).strip() if m else ""
          if not notes:
              notes = "本次发布 " + ver + "，详见 CHANGELOG.md。"
          open("release-notes.md", "w", encoding="utf-8").write(notes)
          print(f"已提取发布说明（版本 {ver}），字符数 {len(notes)}")
          PY

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
